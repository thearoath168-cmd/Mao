<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BaZi Master · 八字大师</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;600&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5efe2;--card:#fbf7ee;--ink:#1d1a17;--ink2:#4a433b;--mute:#7d7366;--line:#e2d6bf;--cin:#b0362a;--gold:#b0812f;--blue:#3a67b0;
--wood:#3f7a4c;--fire:#c0392b;--earth:#a06d25;--metal:#5d6470;--water:#2b4d7e;--good:#2f7a4a;--bad:#b0362a;--mixed:#a07a1f;
--serif:"Cormorant Garamond",Georgia,"Noto Serif SC","Noto Serif CJK SC",serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--cjk:"Noto Serif SC","Noto Serif CJK SC","Songti SC",serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.app{max-width:1240px;margin:0 auto;padding:0 20px 40px}
.hero{background:#17130f;color:#efe6d3;margin:0 -20px 22px;padding:22px 28px;border-bottom:3px solid var(--gold)}
.brand{display:flex;gap:16px;align-items:center;max-width:1200px;margin:0 auto}
.seal{display:grid;place-items:center;width:58px;height:58px;background:var(--cin);color:#f7e9d6;font-family:"Ma Shan Zheng",var(--cjk);font-size:24px;border-radius:6px;transform:rotate(-4deg);flex:none;box-shadow:0 0 0 3px #17130f,0 0 0 4px var(--cin)}
.hero h1{margin:0;font-family:var(--serif);font-weight:600;font-size:34px;letter-spacing:.01em;line-height:1.1}
.hero p{margin:2px 0 0;color:#cdbfa4;font-size:14px}
.grid{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 18px 14px;position:sticky;top:12px}
h2{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 0 10px;line-height:1.2}
h2 small,h3 small{font-family:var(--sans);font-size:12px;color:var(--mute);font-weight:400}
h3{font-size:14px;margin:18px 0 8px;font-weight:600}
label,fieldset{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:0 0 10px;border:0;padding:0}
legend{padding:0;margin-bottom:4px}
input,select{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;font:inherit;font-size:15px;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:4px;background:#fff}
.seg button{flex:1;border:0;background:none;padding:9px 0;font:inherit;font-size:14px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.btns{display:flex;gap:8px;margin-top:4px}
.btns button{flex:1;padding:11px 0;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;font-size:14px}
.primary{background:var(--cin);color:#fff;border:1px solid var(--cin)}.primary:hover{background:#962b21}
.ghost{background:#fff;border:1px solid var(--ink);color:var(--ink)}.ghost:hover{background:#f0e8d8}
.msg{font-size:13px;color:var(--cin);margin:8px 0 0}
.empty,.fine{font-size:12.5px;color:var(--mute)}.center{text-align:center}
.profiles{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:260px;overflow:auto}
.profiles li{display:flex;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.pbtn{flex:1;text-align:left;border:0;background:none;padding:8px 10px;cursor:pointer;font:inherit}
.pbtn b{display:block;font-size:14px}.pbtn span{font-size:12px;color:var(--mute)}
.pbtn:hover{background:#f6efe1}
.del{border:0;background:none;width:34px;font-size:18px;color:var(--mute);cursor:pointer}.del:hover{color:var(--cin);background:#f6e3df}
main{display:grid;gap:18px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.intro ol{padding-left:20px}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;border-left:6px solid var(--mixed)}
.verdict.good{border-left-color:var(--good)}.verdict.bad{border-left-color:var(--bad)}
.vbig{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1;padding:14px 20px;border-radius:10px;color:#fff;background:var(--mixed);letter-spacing:.04em}
.good .vbig{background:var(--good)}.bad .vbig{background:var(--bad)}
.vk{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);font-weight:600}
.verdict h2{font-size:32px;margin:2px 0 6px}
.vmeta{font-size:14px;color:var(--ink2)}
.meter{position:relative;height:8px;border-radius:4px;margin:14px 0 4px;background:linear-gradient(90deg,var(--bad),#d9c9a6 50%,var(--good))}
.meter i{position:absolute;top:-5px;width:4px;height:18px;margin-left:-2px;background:var(--ink);border-radius:2px;box-shadow:0 0 0 2px var(--card)}
.mlab{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
.fc{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.fcard{position:relative;padding-top:16px}
.fic{position:absolute;top:14px;right:16px;font-family:var(--cjk);font-size:22px;color:var(--cin);opacity:.85}
.fcard h3{margin:0 0 6px;font-family:var(--serif);font-size:21px}
.fcard p{margin:0;font-size:14px;color:var(--ink2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ch{font-family:var(--cjk);font-weight:700}.wood{color:var(--wood)}.fire{color:var(--fire)}.earth{color:var(--earth)}.metal{color:var(--metal)}.water{color:var(--water)}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.pcol{text-align:center;padding:10px 4px;border-right:1px dashed var(--line)}.pcol:last-child{border-right:0}.pcol.dm{background:#f3e6d0}
.plab{font-size:11px;color:var(--mute);line-height:1.2}.plab em{font-style:normal}
.pgod{font-size:11.5px;color:var(--cin);margin:6px 0 2px;font-family:var(--cjk);min-height:16px}
.big .ch{font-size:38px;line-height:1.15}
.phid{font-size:13px;margin-top:4px}.phid .ch{margin:0 2px}.ch.sm{font-size:15px}
.small{font-size:13px;color:var(--ink2);margin:10px 0 0}
.els{display:grid;gap:8px}
.elrow{display:grid;grid-template-columns:96px 1fr 98px;gap:10px;align-items:center;font-size:13px}
.elbar{height:10px;background:#efe6d4;border-radius:5px;overflow:hidden}.elbar i{display:block;height:100%;border-radius:0 5px 5px 0}
.elbar i.wood{background:var(--wood)}.elbar i.fire{background:var(--fire)}.elbar i.earth{background:var(--earth)}.elbar i.metal{background:var(--metal)}.elbar i.water{background:var(--water)}
.eltag{font-size:11.5px;font-weight:600;text-align:right}.eltag.fav{color:var(--good)}.eltag.unf{color:var(--bad)}.eltag.neu{color:var(--mute)}
.mt{margin-top:16px}
.lucks{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.lk{display:grid;justify-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 2px;background:#fff;min-width:0}
.lk.on{border-color:var(--cin);box-shadow:0 0 0 1px var(--cin)}
.la{font-size:11px;color:var(--mute)}.ly{font-size:10px;color:var(--mute)}
.notes{margin:0;padding-left:18px}.notes li{margin:4px 0;color:var(--ink2)}
.chartwrap{position:relative}
.chartwrap svg{width:100%;height:auto;display:block;cursor:crosshair}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:0 0 6px;align-items:center}
.legend .hint{margin-left:auto;color:var(--mute)}
.sw{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.sw.line{border-top:2px solid var(--blue)}.sw.step{border-top:2px dashed var(--gold)}
.grid line,.chartwrap .grid{stroke:#e7dcc7;stroke-width:1}
.chartwrap .zero{stroke:#a99c84;stroke-width:1}
.chartwrap .dec{stroke:#e7dcc7;stroke-dasharray:2 3}
.chartwrap .declab{font-size:11px;fill:var(--mute);font-family:var(--cjk)}
.chartwrap .ax{font-size:11px;fill:var(--mute)}.chartwrap .ax.good{fill:var(--good)}.chartwrap .ax.bad{fill:var(--bad)}
.chartwrap .age{fill:#b3a78f}
.aup{fill:var(--good);opacity:.12}.adn{fill:var(--bad);opacity:.12}
.lyear{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round}
.lstep{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:6 4}
.selln{stroke:var(--cin);stroke-width:1.5}.seldot{fill:var(--cin);stroke:var(--card);stroke-width:2}
.hovln{stroke:var(--ink);stroke-width:1;opacity:.35}.hovdot{fill:var(--blue);stroke:var(--card);stroke-width:2}
.tip{position:absolute;top:34px;background:#1d1a17;color:#f2ead9;font-size:12px;line-height:1.5;padding:8px 10px;border-radius:7px;pointer-events:none;width:178px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
@media (max-width:900px){.grid{grid-template-columns:1fr}.panel{position:static}.two{grid-template-columns:1fr}.verdict{grid-template-columns:1fr}.vbig{justify-self:start;font-size:40px}.legend .hint{margin-left:0}}
</style></head>
<body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script>/* BaZi Master engine — methods from "The BaZi Handbook" (Kang Puthearoath) */
const BZ = (() => {
  const S = "甲乙丙丁戊己庚辛壬癸", B = "子丑寅卯辰巳午未申酉戌亥";
  const EL = ["木", "火", "土", "金", "水"];
  const EL_EN = { "木": "Wood", "火": "Fire", "土": "Earth", "金": "Metal", "水": "Water" };
  const B_EL = ["水", "土", "木", "木", "土", "火", "火", "土", "金", "金", "土", "水"];
  const ANIMAL = ["Rat", "Ox", "Tiger", "Rabbit", "Dragon", "Snake", "Horse", "Goat", "Monkey", "Rooster", "Dog", "Pig"];
  const HIDDEN = { "子": "癸", "丑": "己癸辛", "寅": "甲丙戊", "卯": "乙", "辰": "戊乙癸", "巳": "丙戊庚", "午": "丁己", "未": "己丁乙", "申": "庚壬戊", "酉": "辛", "戌": "戊辛丁", "亥": "壬甲" };
  const TG = { "0t": "比肩", "0f": "劫财", "1t": "食神", "1f": "伤官", "2t": "偏财", "2f": "正财", "3t": "七杀", "3f": "正官", "4t": "偏印", "4f": "正印" };
  const TG_EN = { "比肩": "Friend", "劫财": "Rob Wealth", "食神": "Eating God", "伤官": "Hurting Officer", "偏财": "Indirect Wealth", "正财": "Direct Wealth", "七杀": "Seven Killings", "正官": "Direct Officer", "偏印": "Indirect Resource", "正印": "Direct Resource" };
  const ORGAN = { "木": "liver and gall bladder, tendons and eyes", "火": "heart, circulation and blood pressure", "土": "stomach, spleen and digestion", "金": "lungs, large intestine, skin and breathing", "水": "kidneys, bladder, bones and hormones" };

  const sEl = c => S.includes(c) ? EL[Math.floor(S.indexOf(c) / 2)] : B_EL[B.indexOf(c)];
  const tengod = (day, x) => {
    const d = S.indexOf(day), s = S.indexOf(x);
    const diff = ((Math.floor(s / 2) - Math.floor(d / 2)) % 5 + 5) % 5;
    return TG[diff + (d % 2 === s % 2 ? "t" : "f")];
  };
  const relOf = (dmEl, e) => ((EL.indexOf(e) - EL.indexOf(dmEl)) % 5 + 5) % 5; // 0 same 1 output 2 wealth 3 officer 4 resource
  const jz = i => S[((i % 10) + 10) % 10] + B[((i % 12) + 12) % 12];
  const jzIndex = p => { for (let i = 0; i < 60; i++) if (S[i % 10] === p[0] && B[i % 12] === p[1]) return i; return 0; };

  // ---------- astronomy ----------
  function jd(y, m, d, h) {
    if (m <= 2) { y -= 1; m += 12; }
    const A = Math.floor(y / 100), Bb = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + Bb - 1524.5 + h / 24;
  }
  function sunLon(J) {
    const T = (J - 2451545.0) / 36525;
    const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
    const M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) * Math.PI / 180;
    const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M) + (0.019993 - 0.000101 * T) * Math.sin(2 * M) + 0.000289 * Math.sin(3 * M);
    const om = (125.04 - 1934.136 * T) * Math.PI / 180;
    return (((L0 + C - 0.00569 - 0.00478 * Math.sin(om)) % 360) + 360) % 360;
  }
  // signed angular distance a-b in (-180,180]
  const adiff = (a, b) => { let x = ((a - b) % 360 + 540) % 360 - 180; return x; };
  // days from J to the next (dir=+1) or previous (dir=-1) jie (lon ≡ 15 mod 30)
  function daysToJie(J, dir) {
    const lon = sunLon(J);
    let target = dir > 0 ? Math.ceil((lon - 15) / 30 + 1e-9) * 30 + 15 : Math.floor((lon - 15) / 30 - 1e-9) * 30 + 15;
    target = ((target % 360) + 360) % 360;
    let a = J, b = J + dir * 35;
    for (let i = 0; i < 60; i++) {
      const mid = (a + b) / 2;
      const dm = adiff(sunLon(mid), target);
      if ((dir > 0 && dm < 0) || (dir < 0 && dm > 0)) a = mid; else b = mid;
    }
    return Math.abs((a + b) / 2 - J);
  }

  // ---------- chart ----------
  function cast({ date, time, sex, tz }) {
    const [y, m, d] = date.split("-").map(Number);
    let [hh, mi] = (time || "12:00").split(":").map(Number);
    const Jut = jd(y, m, d, hh + mi / 60 - tz);
    const lon = sunLon(Jut);
    const mIdx = Math.floor((((lon - 315) % 360) + 360) % 360 / 30);
    let yy = y;
    if (m === 1 || (m === 2 && lon < 315 && lon > 200)) yy = y - 1;
    const ys = ((yy - 4) % 10 + 10) % 10, yb = ((yy - 4) % 12 + 12) % 12;
    const ms = ((ys % 5) * 2 + 2 + mIdx) % 10, mb = (2 + mIdx) % 12;
    let dn = Math.floor(jd(y, m, d, 0) + 0.5);
    if (hh >= 23) dn += 1;
    const dg = ((dn + 49) % 60 + 60) % 60;
    const ds = dg % 10, db = dg % 12;
    const hb = Math.floor((hh + 1) / 2) % 12;
    const hs = ((ds % 5) * 2 + hb) % 10;
    const pillars = [S[ys] + B[yb], S[ms] + B[mb], S[ds] + B[db], S[hs] + B[hb]];
    // luck
    const yangYear = ys % 2 === 0;
    const forward = (yangYear && sex === "M") || (!yangYear && sex === "F");
    const days = daysToJie(Jut, forward ? 1 : -1);
    const startAge = Math.max(1, Math.round(days / 3));
    const mi0 = jzIndex(pillars[1]);
    const lucks = [];
    for (let k = 1; k <= 9; k++) {
      const p = jz(forward ? mi0 + k : mi0 - k);
      lucks.push({ p, age: startAge + 10 * (k - 1), year: y + startAge + 10 * (k - 1) });
    }
    const chart = { pillars, dm: pillars[2][0], birthYear: y, ganzhiYear: yy, forward, startAgeExact: days / 3, startAge, lucks, sex, lon };
    analyse(chart);
    return chart;
  }

  function hiddenW(b) {
    const h = HIDDEN[b]; const w = h.length === 1 ? [1] : h.length === 2 ? [0.7, 0.3] : [0.6, 0.3, 0.1];
    return h.split("").map((c, i) => [sEl(c), w[i]]);
  }

  function analyse(c) {
    const [Y, M, D, H] = c.pillars, dmEl = sEl(c.dm);
    const tot = { "木": 0, "火": 0, "土": 0, "金": 0, "水": 0 };
    const add = (e, w) => tot[e] += w;
    add(dmEl, 1.0);
    add(sEl(Y[0]), 0.8); add(sEl(M[0]), 1.0); add(sEl(H[0]), 1.0);
    [[Y[1], 0.8], [M[1], 3.0], [D[1], 1.5], [H[1], 1.0]].forEach(([b, w]) => hiddenW(b).forEach(([e, x]) => add(e, w * x)));
    // branch combinations: full triad / meeting adds 2, half triad with the peak adds 1
    const nb = [Y[1], M[1], D[1], H[1]];
    [["申子辰", "水"], ["亥卯未", "木"], ["寅午戌", "火"], ["巳酉丑", "金"]].forEach(([t, e]) => {
      const n = [...t].filter(x => nb.includes(x)).length;
      if (n === 3) add(e, 2); else if (n === 2 && nb.includes(t[1])) add(e, 1);
    });
    [["亥子丑", "水"], ["寅卯辰", "木"], ["巳午未", "火"], ["申酉戌", "金"]].forEach(([t, e]) => { if ([...t].every(x => nb.includes(x))) add(e, 2); });
    const all = Object.values(tot).reduce((a, b) => a + b, 0);
    const self = tot[dmEl] + tot[EL[(EL.indexOf(dmEl) + 4) % 5]];
    const ratio = self / all;
    let type;
    if (ratio >= 0.8) type = "dominant"; else if (ratio <= 0.15) type = "follow";
    else if (ratio >= 0.55) type = "strong"; else if (ratio <= 0.45) type = "weak"; else type = "balanced";
    const val = {};
    const R = [0, 0, 0, 0, 0];
    if (type === "strong") { R[0] = -1; R[4] = -0.8; R[1] = 1; R[2] = 0.8; R[3] = ratio > 0.65 ? 0.4 : 0.7; }
    else if (type === "weak") { R[4] = 1; R[0] = 0.8; R[1] = -0.8; R[2] = -0.9; R[3] = -1; }
    else if (type === "dominant") { R[0] = 1; R[4] = 0.8; R[1] = 0.5; R[2] = -0.6; R[3] = -1; }
    else if (type === "balanced") {
      const k = ratio >= 0.5 ? 1 : -1;
      if (k > 0) { R[0] = -0.5; R[4] = -0.4; R[1] = 0.5; R[2] = 0.4; R[3] = 0.35; }
      else { R[4] = 0.5; R[0] = 0.4; R[1] = -0.4; R[2] = -0.45; R[3] = -0.5; }
    }
    if (type !== "follow") EL.forEach(e => val[e] = R[relOf(dmEl, e)]);
    else {
      let best = null; EL.forEach(e => { if (e !== dmEl && e !== EL[(EL.indexOf(dmEl) + 4) % 5] && (!best || tot[e] > tot[best])) best = e; });
      EL.forEach(e => val[e] = -0.3);
      val[best] = 1; val[EL[(EL.indexOf(best) + 4) % 5]] = 0.6; val[dmEl] = -1; val[EL[(EL.indexOf(dmEl) + 4) % 5]] = -0.9;
    }
    // climate adjustment 调候
    const season = "寅卯辰".includes(M[1]) ? "spring" : "巳午未".includes(M[1]) ? "summer" : "申酉戌".includes(M[1]) ? "autumn" : "winter";
    let climate = "";
    if (season === "winter" && tot["火"] < 1.2) { val["火"] = Math.min(1, val["火"] + 0.5); val["水"] = Math.max(-1, val["水"] - 0.3); climate = "Born in deep winter with little Fire: warmth (Fire) is given extra weight (调候 climate adjustment)."; }
    if (season === "summer" && tot["水"] < 1.2) { val["水"] = Math.min(1, val["水"] + 0.5); val["火"] = Math.max(-1, val["火"] - 0.3); climate = "Born in high summer with little Water: moisture (Water) is given extra weight (调候 climate adjustment)."; }
    const sorted = [...EL].sort((a, b) => val[b] - val[a]);
    Object.assign(c, { tot, all, ratio, type, val, useful: sorted[0], favourable: sorted[1], unfavourable: sorted[4], season, climate, dmEl });
  }

  // ---------- relationships ----------
  const CLASH = { "子": "午", "午": "子", "丑": "未", "未": "丑", "寅": "申", "申": "寅", "卯": "酉", "酉": "卯", "辰": "戌", "戌": "辰", "巳": "亥", "亥": "巳" };
  const COMB6 = { "子": "丑", "丑": "子", "寅": "亥", "亥": "寅", "卯": "戌", "戌": "卯", "辰": "酉", "酉": "辰", "巳": "申", "申": "巳", "午": "未", "未": "午" };
  const SCLASH = { "甲": "庚", "庚": "甲", "乙": "辛", "辛": "乙", "丙": "壬", "壬": "丙", "丁": "癸", "癸": "丁" };
