name: FX & Gold trend agent

# Runs the agent in the cloud every 15 minutes (free on GitHub Actions)
# and pushes turning-point alerts to Telegram / Discord / ntfy.
# Add the secrets you use under: Settings → Secrets and variables → Actions
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, DISCORD_WEBHOOK_URL, NTFY_TOPIC

on:
  schedule:
    - cron: "*/15 * * * 0-5"   # Sun–Fri (forex market hours, UTC)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-agent/requirements.txt
      - run: pip install -r requirements.txt
      # remember which alerts were already sent so you are not notified twice
      - uses: actions/cache/restore@v4
        with:
          path: trading-agent/.agent_state.json
          key: fx-agent-state-${{ github.run_id }}
          restore-keys: fx-agent-state-
      - run: python -m fxagent scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: trading-agent/.agent_state.json
          key: fx-agent-state-${{ github.run_id }}
